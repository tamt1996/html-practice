<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>POS Restaurant UI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HEADER -->
  <header class="header">
    <h1 class="logo">
      <span class="logo-p">P</span>
      <span class="logo-o">O</span>
      <span class="logo-s">S</span>
    </h1>

    <input
      class="search"
      type="text"
      placeholder="Search product or any order..."
    >

    <section class="header-right">
      <time class="date">October 18th 2022, 10:00AM</time>
      <button class="add-btn">Add Table</button>
    </section>
  </header>

  <!-- MAIN -->
  <main class="container">

    <!-- PRODUCTS -->
    <section class="products">

      <!-- 1 -->
      <article class="card">
        <img src="assets/chicken_wings.png" alt="Chicken Wings">
        <h3 class="card-title">CHICKEN WINGS</h3>
        <footer class="meta">
          <span class="meta-label">Category:</span>
          <span class="badge">N</span>
          <span class="spicy spicy-2"></span>
        </footer>
      </article>

      <!-- 2 -->
      <article class="card">
        <img src="assets/fries.png" alt="French Fries">
        <h3 class="card-title">FRENCH FRIES</h3>
        <footer class="meta">
          <span class="meta-label">Category:</span>
          <span class="badge">G</span>
        </footer>
      </article>

      <!-- 3 -->
      <article class="card">
        <img src="assets/salad.png" alt="Summer Salad">
        <h3 class="card-title">SUMMER SALAD</h3>
        <footer class="meta">
          <span class="meta-label">Category:</span>
          <span class="badge">N</span>
          <span class="spicy spicy-1"></span>
        </footer>
      </article>

      <!-- 4 -->
      <article class="card">
        <img src="assets/salad.png" alt="Summer Salad">
        <h3 class="card-title">SUMMER SALAD</h3>
        <footer class="meta">
          <span class="meta-label">Category:</span>
          <span class="badge">G</span>
          <span class="spicy spicy-2"></span>
        </footer>
      </article>

      <!-- 5 -->
      <article class="card">
        <img src="assets/pizza.png" alt="Pizza">
        <h3 class="card-title">PIZZA</h3>
        <footer class="meta">
          <span class="meta-label">Category:</span>
          <span class="badge">N</span>
          <span class="spicy spicy-2"></span>
        </footer>
      </article>

      <!-- 6 -->
      <article class="card">
        <img src="assets/desserts.png" alt="Desserts">
        <h3 class="card-title">DESSERTS</h3>
        <footer class="meta">
          <span class="meta-label">Category:</span>
          <span class="badge">G</span>
          <span class="spicy spicy-1"></span>
        </footer>
      </article>

      <!-- 7 -->
      <article class="card">
        <img src="assets/cola.png" alt="Cola">
        <h3 class="card-title">COLA</h3>
        <footer class="meta">
          <span class="meta-label">Category:</span>
          <span class="badge">G</span>
          <span class="spicy spicy-2"></span>
        </footer>
      </article>

      <!-- 8 -->
      <article class="card">
        <img src="assets/cola.png" alt="Cola">
        <h3 class="card-title">COLA</h3>
        <footer class="meta">
          <span class="meta-label">Category:</span>
          <span class="badge">G</span>
          <span class="spicy spicy-2"></span>
        </footer>
      </article>

      <!-- 9 -->
      <article class="card">
        <img src="assets/pizza.png" alt="Pizza">
        <h3 class="card-title">PIZZA</h3>
        <footer class="meta">
          <span class="meta-label">Category:</span>
          <span class="badge">N</span>
        </footer>
      </article>

      <article class="card">

      </article>

      <article class="card">
        <img src="assets/cola.png" alt="Cola">
        <h3 class="card-title">COLA</h3>
      </article>

    </section>

    <!-- CATEGORIES -->
    <aside class="categories">
      <nav class="category-nav">
        <button class="cat-btn active">Starter</button>
        <button class="cat-btn">Main Course</button>
        <button class="cat-btn">Drinks</button>
        <button class="cat-btn">Desserts</button>
      </nav>
    </aside>

  </main>

</body>
</html>
